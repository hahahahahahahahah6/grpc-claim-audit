[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grpc-claim-audit"
version = "0.1.0"
description = "Offline static audit of documented remote-procedure-call capabilities"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.scripts]
grpc-claim-audit = "grpc_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["grpc_claim_audit*"]
